    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How long does it take to build a website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Project timelines vary based on complexity. A basic website typically takes 2-4 weeks, while more complex projects with custom functionality can take 6-12 weeks. We'll provide a detailed timeline during our initial consultation."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to provide content for my website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ideally, yes. You know your business best. However, we offer copywriting services if you need help creating content. We'll work with you to ensure your message is clear and compelling."
          }
        },
        {
          "@type": "Question",
          "name": "Will my website work on mobile devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! Every website we build is fully responsive and tested across all devices and screen sizes. Mobile-friendly design is standard, not an add-on."
          }
        },
        {
          "@type": "Question",
          "name": "What are your payment terms?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We typically require 50% deposit to begin work, with the remaining 50% due upon project completion. For larger projects, we can arrange milestone-based payments."
          }
        },
        {
          "@type": "Question",
          "name": "Do you provide hosting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We can help you set up hosting with reliable providers and manage it for you, or work with your existing hosting. We'll recommend the best option based on your site's needs."
          }
        },
        {
          "@type": "Question",
          "name": "What about SEO - will my site rank on Google?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We build all sites with SEO best practices: proper structure, fast loading times, mobile optimization, and meta tags. For comprehensive SEO strategies, we offer additional services."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer ongoing support after launch?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! All packages include a post-launch support period. We also offer ongoing maintenance plans for continued updates, security monitoring, and priority support."
          }
        },
        {
          "@type": "Question",
          "name": "What if I need changes after the project is complete?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Minor changes within the support period are included. After that, we offer hourly rates or maintenance packages for ongoing updates. We're always here to help your site grow."
          }
        }
      ]
    }
    </script>
