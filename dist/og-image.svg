<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Inolas Websites — Professional Web Development & Design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="1050" cy="120" r="260" fill="#2563eb" opacity="0.18"/>
  <circle cx="120" cy="560" r="200" fill="#3b82f6" opacity="0.12"/>

  <!-- Logo mark -->
  <rect x="100" y="96" width="96" height="96" rx="22" fill="#2563eb"/>
  <text x="148" y="162" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle">IW</text>

  <!-- Brand name -->
  <text x="216" y="146" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Inolas</text>
  <text x="216" y="146" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#60a5fa" dx="150">Websites</text>

  <!-- Headline -->
  <text x="100" y="330" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#ffffff">Building Digital Experiences</text>
  <text x="100" y="420" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#ffffff">That <tspan fill="url(#accent)">Drive Results</tspan></text>

  <!-- Subtext -->
  <text x="100" y="490" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" fill="#cbd5e1">Custom Websites · Web Applications · Landing Pages · CMS</text>

  <!-- Accent bar -->
  <rect x="100" y="524" width="220" height="8" rx="4" fill="url(#accent)"/>

  <!-- URL -->
  <text x="100" y="582" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">inolas.ca</text>
</svg>
